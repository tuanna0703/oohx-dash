  <rect x="569" y="157" width="147" height="77" rx="4" fill="#FF3B30"/>
  <rect x="578" y="165" width="70" height="7" rx="3" fill="rgba(255,255,255,0.9)"/>
  <rect x="578" y="178" width="110" height="9" rx="3" fill="rgba(255,255,255,0.95)"/>
  <rect x="578" y="195" width="90" height="9" rx="3" fill="rgba(255,255,255,0.9)"/>
  <rect x="578" y="213" width="60" height="14" rx="7" fill="#FFD60A"/>
