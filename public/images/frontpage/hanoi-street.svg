    <circle cx="212" cy="370" r="7" fill="#1C1C1E"/><circle cx="212" cy="370" r="4" fill="#444"/>
    <circle cx="244" cy="370" r="7" fill="#1C1C1E"/><circle cx="244" cy="370" r="4" fill="#444"/>
    <rect x="490" y="380" width="52" height="28" rx="5" fill="#FF3B30"/>
    <rect x="495" y="368" width="38" height="18" rx="4" fill="#E03030" opacity="0.9"/>
    <circle cx="502" cy="410" r="7" fill="#1C1C1E"/><circle cx="502" cy="410" r="4" fill="#444"/>
    <circle cx="534" cy="410" r="7" fill="#1C1C1E"/><circle cx="534" cy="410" r="4" fill="#444"/>
    <rect x="310" y="430" width="44" height="24" rx="5" fill="#34C759"/>
    <circle cx="318" cy="456" r="6" fill="#1C1C1E"/><circle cx="318" cy="456" r="3" fill="#444"/>
    <circle cx="346" cy="456" r="6" fill="#1C1C1E"/><circle cx="346" cy="456" r="3" fill="#444"/>
