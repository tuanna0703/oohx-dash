<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="term" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8F8F8"/>
      <stop offset="100%" stop-color="#ECECEC"/>
    </linearGradient>
    <linearGradient id="screen3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF9F0A"/>
      <stop offset="100%" stop-color="#C93400"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#term)"/>
  <!-- Ceiling -->
  <rect x="0" y="0" width="800" height="60" fill="#E8E8E4"/>
  <!-- Ceiling grid lines -->
  <g stroke="#D0D0CC" stroke-width="1">
    <line x1="0" y1="30" x2="800" y2="30"/>
    <line x1="100" y1="0" x2="100" y2="60"/>
    <line x1="200" y1="0" x2="200" y2="60"/>
    <line x1="300" y1="0" x2="300" y2="60"/>
    <line x1="400" y1="0" x2="400" y2="60"/>
    <line x1="500" y1="0" x2="500" y2="60"/>
    <line x1="600" y1="0" x2="600" y2="60"/>
    <line x1="700" y1="0" x2="700" y2="60"/>
  </g>
  <!-- Ceiling lights -->
  <rect x="80" y="25" width="40" height="8" rx="4" fill="#FFF9E6"/>
  <rect x="280" y="25" width="40" height="8" rx="4" fill="#FFF9E6"/>
  <rect x="480" y="25" width="40" height="8" rx="4" fill="#FFF9E6"/>
  <rect x="680" y="25" width="40" height="8" rx="4" fill="#FFF9E6"/>
  <!-- Floor -->
  <rect x="0" y="400" width="800" height="100" fill="#E0E0DC"/>
  <!-- Floor tiles -->
  <g stroke="#D4D4D0" stroke-width="0.5" opacity="0.8">
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="100" y1="400" x2="100" y2="500"/>
    <line x1="200" y1="400" x2="200" y2="500"/>
    <line x1="300" y1="400" x2="300" y2="500"/>
    <line x1="400" y1="400" x2="400" y2="500"/>
    <line x1="500" y1="400" x2="500" y2="500"/>
    <line x1="600" y1="400" x2="600" y2="500"/>
    <line x1="700" y1="400" x2="700" y2="500"/>
  </g>
  <!-- Columns -->
  <rect x="95" y="60" width="20" height="340" fill="#DDDDD8"/>
  <rect x="395" y="60" width="20" height="340" fill="#DDDDD8"/>
  <rect x="685" y="60" width="20" height="340" fill="#DDDDD8"/>
  <!-- Departure board -->
  <rect x="150" y="65" width="220" height="140" rx="4" fill="#1C1C1E"/>
  <rect x="154" y="69" width="212" height="132" rx="3" fill="#0A1628"/>
  <text x="260" y="90" text-anchor="middle" font-family="monospace" font-size="11" fill="#FFD60A" font-weight="700">DEPARTURES</text>
  <g fill="#4ADE80" font-family="monospace" font-size="10">
    <text x="163" y="108">VN210  HAN  08:45  ON TIME</text>
    <text x="163" y="122">VJ105  SGN  09:20  ON TIME</text>
    <text x="163" y="136" fill="#FF4500">QH201  DAD  09:45  DELAY</text>
    <text x="163" y="150">VN304  HAN  10:15  ON TIME</text>
    <text x="163" y="164">VN502  SGN  10:30  BOARDING</text>
    <text x="163" y="178">BL125  CXR  11:00  ON TIME</text>
  </g>
  <!-- BIG advertising screen -->
  <rect x="240" y="200" width="320" height="195" rx="6" fill="#1C1C1E"/>
  <rect x="244" y="204" width="312" height="187" rx="4" fill="url(#screen3)"/>
  <!-- Ad content orange -->
  <rect x="244" y="204" width="312" height="187" rx="4" fill="#2A1200"/>
  <rect x="265" y="222" width="100" height="7" rx="3" fill="rgba(255,255,255,0.85)"/>
  <rect x="265" y="238" width="190" height="11" rx="4" fill="rgba(255,255,255,0.95)"/>
  <rect x="265" y="257" width="150" height="11" rx="4" fill="rgba(255,255,255,0.95)"/>
  <rect x="265" y="276" width="110" height="7" rx="3" fill="rgba(255,255,255,0.6)"/>
  <!-- Product visual right side -->
  <rect x="410" y="218" width="128" height="128" rx="8" fill="rgba(255,159,10,0.2)"/>
  <ellipse cx="474" cy="282" rx="45" ry="45" fill="rgba(255,159,10,0.3)"/>
  <ellipse cx="474" cy="282" rx="30" ry="30" fill="rgba(255,159,10,0.5)"/>
  <ellipse cx="474" cy="282" rx="18" ry="18" fill="#FF9F0A"/>
  <!-- CTA -->
  <rect x="265" y="298" width="100" height="26" rx="13" fill="#FF9F0A"/>
  <rect x="278" y="306" width="65" height="8" rx="3" fill="rgba(255,255,255,0.95)"/>
  <!-- Screen mount -->
  <rect x="388" y="396" width="24" height="8" fill="#2C2C2E"/>
  <!-- Travellers silhouettes -->
  <g opacity="0.5">
    <g fill="#555">
      <circle cx="140" cy="370" r="15"/>
      <rect x="128" y="384" width="24" height="50" rx="6"/>
      <rect x="125" y="360" width="6" height="40" rx="2"/>
    </g>
    <g fill="#666">
      <circle cx="630" cy="365" r="14"/>
      <rect x="619" y="378" width="22" height="45" rx="6"/>
      <rect x="648" y="370" width="5" height="35" rx="2"/>
    </g>
    <g fill="#777">
      <circle cx="700" cy="375" r="13"/>
      <rect x="690" y="387" width="20" height="42" rx="5"/>
    </g>
  </g>
  <!-- Wayfinding signs -->
  <rect x="30" y="150" width="60" height="30" rx="4" fill="#0071E3"/>
  <text x="60" y="170" text-anchor="middle" font-family="system-ui" font-size="10" fill="#fff" font-weight="700">GATES →</text>
  <rect x="710" y="150" width="60" height="30" rx="4" fill="#0071E3"/>
  <text x="740" y="170" text-anchor="middle" font-family="system-ui" font-size="10" fill="#fff" font-weight="700">← CHECK-IN</text>
  <text x="20" y="490" font-family="system-ui,sans-serif" font-size="11" fill="rgba(0,0,0,0.25)" font-weight="600">OOHX · Airport Terminal · Nội Bài T2</text>
</svg>