<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0E1A"/>
      <stop offset="60%" stop-color="#1A1F35"/>
      <stop offset="100%" stop-color="#252B45"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C1C1E"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="glow-bl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A4FF6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1A3BC4" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <filter id="glow2"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <!-- Sky -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <!-- Stars -->
  <g opacity="0.6">
    <circle cx="50" cy="40" r="1" fill="#fff" opacity="0.8"/>
    <circle cx="120" cy="25" r="1.5" fill="#fff" opacity="0.6"/>
    <circle cx="200" cy="55" r="1" fill="#fff" opacity="0.9"/>
    <circle cx="320" cy="20" r="1" fill="#fff" opacity="0.7"/>
    <circle cx="450" cy="45" r="1.5" fill="#fff" opacity="0.5"/>
    <circle cx="580" cy="30" r="1" fill="#fff" opacity="0.8"/>
    <circle cx="680" cy="60" r="1" fill="#fff" opacity="0.6"/>
    <circle cx="750" cy="35" r="1" fill="#fff" opacity="0.9"/>
  </g>
  <!-- Buildings silhouette -->
  <g fill="#151820">
    <rect x="0" y="200" width="60" height="200"/>
    <rect x="55" y="240" width="45" height="160"/>
    <rect x="95" y="180" width="55" height="220"/>
    <rect x="600" y="210" width="50" height="190"/>
    <rect x="645" y="175" width="60" height="225"/>
    <rect x="700" y="220" width="45" height="180"/>
    <rect x="740" y="195" width="60" height="205"/>
  </g>
  <!-- Building windows -->
  <g fill="#FFD60A" opacity="0.4">
    <rect x="10" y="215" width="6" height="5" rx="1"/><rect x="22" y="215" width="6" height="5" rx="1"/>
    <rect x="10" y="228" width="6" height="5" rx="1"/><rect x="22" y="228" width="6" height="5" rx="1"/>
    <rect x="10" y="241" width="6" height="5" rx="1"/>
    <rect x="105" y="195" width="6" height="5" rx="1"/><rect x="118" y="195" width="6" height="5" rx="1"/>
    <rect x="105" y="210" width="6" height="5" rx="1"/><rect x="118" y="210" width="6" height="5" rx="1"/>
    <rect x="650" y="185" width="6" height="5" rx="1"/><rect x="663" y="185" width="6" height="5" rx="1"/>
    <rect x="650" y="200" width="6" height="5" rx="1"/><rect x="663" y="200" width="6" height="5" rx="1"/>
    <rect x="710" y="230" width="6" height="5" rx="1"/><rect x="723" y="230" width="6" height="5" rx="1"/>
  </g>
  <!-- Billboard pole -->
  <rect x="375" y="120" width="12" height="200" fill="#2C2C2E" rx="3"/>
  <rect x="360" y="300" width="42" height="20" fill="#2C2C2E" rx="4"/>
  <!-- Billboard glow (behind) -->
  <rect x="155" y="60" width="452" height="240" rx="8" fill="#2A4FF6" opacity="0.15" filter="url(#glow2)"/>
  <!-- Billboard frame -->
  <rect x="158" y="62" width="450" height="238" rx="6" fill="#1C1C1E"/>
  <rect x="162" y="66" width="442" height="230" rx="4" fill="url(#glow-bl)"/>
  <!-- Billboard content: OOHX ad mockup -->
  <rect x="162" y="66" width="442" height="230" rx="4" fill="#1A2E8A"/>
  <!-- Ad content -->
  <rect x="180" y="82" width="200" height="4" rx="2" fill="rgba(255,255,255,0.9)"/>
  <rect x="180" y="94" width="280" height="8" rx="3" fill="rgba(255,255,255,0.95)"/>
  <rect x="180" y="110" width="220" height="8" rx="3" fill="rgba(255,255,255,0.95)"/>
  <rect x="180" y="128" width="160" height="5" rx="2" fill="rgba(255,255,255,0.6)"/>
  <!-- Product visual (car shape) -->
  <ellipse cx="500" cy="196" rx="110" ry="45" fill="#1A4A8A" opacity="0.8"/>
  <rect x="420" y="165" width="160" height="50" rx="20" fill="#0060C0"/>
  <rect x="390" y="185" width="220" height="35" rx="8" fill="#2A4FF6"/>
  <circle cx="430" cy="225" r="15" fill="#0A0A0A"/>
  <circle cx="430" cy="225" r="10" fill="#333"/>
  <circle cx="430" cy="225" r="5" fill="#666"/>
  <circle cx="550" cy="225" r="15" fill="#0A0A0A"/>
  <circle cx="550" cy="225" r="10" fill="#333"/>
  <circle cx="550" cy="225" r="5" fill="#666"/>
  <!-- CTA button -->
  <rect x="180" y="248" width="100" height="28" rx="14" fill="#FFD60A"/>
  <rect x="190" y="256" width="60" height="8" rx="3" fill="#000" opacity="0.7"/>
  <!-- LED pixel effect overlay -->
  <rect x="162" y="66" width="442" height="230" rx="4" fill="url(#pixels)" opacity="0.03"/>
  <!-- Frame border -->
  <rect x="158" y="62" width="450" height="238" rx="6" fill="none" stroke="#3A3A3C" stroke-width="3"/>
  <!-- Billboard structure -->
  <rect x="155" y="297" width="458" height="8" rx="3" fill="#2C2C2E"/>
  <!-- Road -->
  <rect x="0" y="360" width="800" height="140" fill="url(#road)"/>
  <!-- Road markings -->
  <g opacity="0.4">
    <rect x="390" y="370" width="20" height="50" rx="3" fill="#FFD60A"/>
    <rect x="390" y="440" width="20" height="50" rx="3" fill="#FFD60A"/>
    <rect x="390" y="440" width="20" height="50" rx="3" fill="#FFD60A"/>
  </g>
  <!-- Cars light trails -->
  <g opacity="0.7">
    <rect x="0" y="390" width="180" height="3" rx="2" fill="#FF4500"/>
    <rect x="0" y="398" width="220" height="2" rx="1" fill="#FF3000" opacity="0.5"/>
    <rect x="620" y="380" width="180" height="3" rx="2" fill="#FFE566"/>
    <rect x="650" y="388" width="150" height="2" rx="1" fill="#FFD60A" opacity="0.5"/>
  </g>
  <!-- Ground reflection of billboard -->
  <rect x="162" y="358" width="442" height="40" rx="0" fill="#2A4FF6" opacity="0.04"/>
  <!-- Watermark -->
  <text x="20" y="490" font-family="system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.25)" font-weight="600">OOHX · LED Billboard Premium</text>
</svg>