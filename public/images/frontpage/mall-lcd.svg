<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8E4DC"/>
      <stop offset="100%" stop-color="#C8C4BC"/>
    </linearGradient>
    <linearGradient id="ceiling" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F5F0"/>
      <stop offset="100%" stop-color="#E8E8E4"/>
    </linearGradient>
    <linearGradient id="screen-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34C759" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#248A3D" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <!-- Mall interior background -->
  <rect width="800" height="500" fill="#F0EDE8"/>
  <!-- Ceiling -->
  <rect x="0" y="0" width="800" height="80" fill="url(#ceiling)"/>
  <!-- Ceiling lights -->
  <g>
    <ellipse cx="150" cy="30" rx="40" ry="8" fill="#FFF8E1" opacity="0.8"/>
    <ellipse cx="400" cy="30" rx="40" ry="8" fill="#FFF8E1" opacity="0.8"/>
    <ellipse cx="650" cy="30" rx="40" ry="8" fill="#FFF8E1" opacity="0.8"/>
    <!-- Light beams -->
    <path d="M110 38 L80 200 L220 200 Z" fill="rgba(255,248,225,0.08)"/>
    <path d="M360 38 L330 200 L470 200 Z" fill="rgba(255,248,225,0.08)"/>
    <path d="M610 38 L580 200 L720 200 Z" fill="rgba(255,248,225,0.08)"/>
  </g>
  <!-- Walls -->
  <rect x="0" y="80" width="80" height="420" fill="#E0DCD4"/>
  <rect x="720" y="80" width="80" height="420" fill="#E0DCD4"/>
  <!-- Floor perspective -->
  <polygon points="0,500 800,500 680,320 120,320" fill="url(#floor)"/>
  <!-- Floor tiles -->
  <g stroke="#D0CCC4" stroke-width="1" opacity="0.5">
    <line x1="0" y1="380" x2="800" y2="380"/>
    <line x1="0" y1="440" x2="800" y2="440"/>
    <line x1="200" y1="320" x2="120" y2="500"/>
    <line x1="400" y1="320" x2="320" y2="500"/>
    <line x1="600" y1="320" x2="520" y2="500"/>
  </g>
  <!-- Store fronts -->
  <rect x="80" y="100" width="180" height="220" fill="#F8F4EE" stroke="#D0CCC4"/>
  <rect x="90" y="105" width="160" height="180" fill="#E8F4FF"/>
  <text x="170" y="200" text-anchor="middle" font-family="system-ui" font-size="16" fill="#2A4FF6" font-weight="700">STORE</text>
  <rect x="540" y="100" width="180" height="220" fill="#F8F4EE" stroke="#D0CCC4"/>
  <rect x="550" y="105" width="160" height="180" fill="#FFF0F0"/>
  <text x="630" y="200" text-anchor="middle" font-family="system-ui" font-size="16" fill="#FF3B30" font-weight="700">BRAND</text>
  <!-- LCD Screen frame -->
  <rect x="270" y="90" width="260" height="210" rx="6" fill="#1C1C1E"/>
  <rect x="276" y="96" width="248" height="198" rx="4" fill="url(#screen-glow)"/>
  <!-- Screen content -->
  <rect x="276" y="96" width="248" height="198" rx="4" fill="#0A3A20"/>
  <!-- Ad content on screen -->
  <rect x="295" y="115" width="80" height="6" rx="3" fill="rgba(255,255,255,0.85)"/>
  <rect x="295" y="130" width="150" height="10" rx="4" fill="rgba(255,255,255,0.95)"/>
  <rect x="295" y="148" width="120" height="10" rx="4" fill="rgba(255,255,255,0.95)"/>
  <rect x="295" y="166" width="90" height="6" rx="3" fill="rgba(255,255,255,0.6)"/>
  <!-- Product image area -->
  <rect x="380" y="115" width="125" height="120" rx="6" fill="rgba(52,199,89,0.15)"/>
  <circle cx="442" cy="175" r="40" fill="rgba(52,199,89,0.25)"/>
  <circle cx="442" cy="175" r="28" fill="rgba(52,199,89,0.4)"/>
  <circle cx="442" cy="175" r="16" fill="#34C759" opacity="0.8"/>
  <!-- CTA -->
  <rect x="295" y="258" width="80" height="22" rx="11" fill="#34C759"/>
  <rect x="305" y="264" width="50" height="7" rx="3" fill="rgba(255,255,255,0.9)"/>
  <!-- Screen mount -->
  <rect x="388" y="300" width="24" height="20" fill="#2C2C2E"/>
  <rect x="370" y="318" width="60" height="6" rx="2" fill="#2C2C2E"/>
  <!-- People silhouettes -->
  <g fill="#8A7A6A" opacity="0.5">
    <!-- Person 1 -->
    <ellipse cx="200" cy="315" rx="12" ry="6"/>
    <rect x="194" y="310" width="12" height="40" rx="4"/>
    <ellipse cx="200" cy="308" rx="8" ry="8"/>
    <!-- Person 2 -->
    <ellipse cx="580" cy="312" rx="12" ry="6"/>
    <rect x="574" y="307" width="12" height="38" rx="4"/>
    <ellipse cx="580" cy="305" rx="8" ry="8"/>
  </g>
  <!-- Screen glow on floor -->
  <ellipse cx="400" cy="330" rx="80" ry="15" fill="#34C759" opacity="0.06"/>
  <text x="20" y="490" font-family="system-ui,sans-serif" font-size="11" fill="rgba(0,0,0,0.25)" font-weight="600">OOHX · LCD Mall Indoor</text>
</svg>