; ── Production PHP config cho oohx-dash ─────────────────────────────────────
memory_limit = 512M
max_execution_time = 120
post_max_size = 64M
upload_max_filesize = 50M
max_file_uploads = 30
date.timezone = Asia/Ho_Chi_Minh
expose_php = Off

; Error reporting — production: log only, không hiển thị
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Session — handled by Laravel (database driver mặc định), nhưng đặt fallback
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1

; ── OPcache (production tuning) ──────────────────────────────────────────────
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0          ; Production: không re-stat — rebuild image khi deploy
opcache.revalidate_freq = 0
opcache.fast_shutdown = 1
opcache.jit = 1255
opcache.jit_buffer_size = 128M

; ── Realpath cache ───────────────────────────────────────────────────────────
realpath_cache_size = 4096K
realpath_cache_ttl = 600
