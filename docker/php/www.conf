; ── php-fpm pool config — production ────────────────────────────────────────
[www]

user = www-data
group = www-data

; Listen trên TCP để Caddy connect cross-container
listen = 0.0.0.0:9000
listen.backlog = 511

; Process management — dynamic phù hợp với load không đều
pm = dynamic
pm.max_children = 40
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 12
pm.max_requests = 500              ; Recycle worker sau 500 requests để tránh leak
pm.process_idle_timeout = 60s

; Logs — stream ra stderr cho docker logs
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null              ; Tắt access log của fpm; Caddy đã log
clear_env = no                       ; Cho phép truy cập env vars của container

; Status endpoint cho healthcheck (chỉ accessible từ caddy network)
pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong

; Slow request log
request_slowlog_timeout = 10s
slowlog = /dev/stderr

; Limits
request_terminate_timeout = 120s
